# 此工作流构建 ImmortalWrt 25.12.x armsr-armv8 (ARM64 通用虚拟机) 固件
# 产出格式 qcow2 + vmdk，直接发 Release（img-installer 的 ISO 制作硬编码 x86_64，
# 不支持 arm64，故不走 ISO 两阶段，改 qcow2 直发）
# 参数结构照 Build 25.12.x ISO x86-64 工作流（luci 版本 / 空间大小 / docker / pppoe）
# 软件组合与 192.168.0.10 (ImmortalWrt 25.12.1 arm64) 完全一致（246 官方包）
# 使用方式：Actions 手动触发，选择 luci 版本 / 空间大小 / docker / pppoe 参数
# 安装方式：qcow2 导入 ARM64 虚拟机（UTM / PVE / QEMU-KVM），vmdk 用于 VMware

name: Build 25.12.x QEMU-armsr-armv8

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '2G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/armsr-armv8/build25.sh

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ github.event.inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ github.event.inputs.pppoe_account }}" || -z "${{ github.event.inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: ✅ 正在构建ImmortalWrt固件25.12.x (armsr-armv8)
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_PARTSIZE=1024
              ;;
            2G)
              ROOTFS_PARTSIZE=2048
              ;;
            3G)
              ROOTFS_PARTSIZE=3072
              ;;
            4G)
              ROOTFS_PARTSIZE=4096
              ;;
          esac
          echo "ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE" >> $GITHUB_ENV
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for rootfs_partsize: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
            -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
            -v "${{ github.workspace }}/armsr-armv8/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/armsr-armv8/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="generic" \
            -e ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
          immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} /bin/bash -c "mkdir -p /home/build/immortalwrt/scripts && touch /home/build/immortalwrt/scripts/opkg-key && chmod +x /home/build/immortalwrt/scripts/opkg-key && echo 'CONFIG_USE_APK=y' >> /home/build/immortalwrt/.config && sed -i '/block-readers\\|small-readers/d' /home/build/immortalwrt/include/image.mk && sed -i 's/--no-scripts/--no-scripts --allow-untrusted/' /home/build/immortalwrt/include/image.mk && /home/build/immortalwrt/build.sh"

      - name: ✅ 复制固件到根目录
        run: |
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*.qcow2 ${{ github.workspace }}/
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*.vmdk ${{ github.workspace }}/

      - name: 🚀 上传固件到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: QEMU
          name: ImmortWrt-QEMU-armsr-armv8-25.12.x
          body_path: ${{ github.workspace }}/armsr-armv8/info.md
          files: |
            ${{ github.workspace }}/*.qcow2
            ${{ github.workspace }}/*.vmdk
          token: ${{ secrets.GITHUB_TOKEN }}
