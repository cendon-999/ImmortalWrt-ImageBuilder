# 此工作流构建 ImmortalWrt 25.12.x armsr-armv8 (ARM64 通用虚拟机) 固件
# 产出格式 qcow2 + vmdk，直接发 Release
# 25.12.2 无 Docker 镜像，改用官方 imagebuilder 包下载构建（自包含，交叉编译 arm64）

name: Build 25.12.x QEMU-armsr-armv8

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '2G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/armsr-armv8/build25.sh

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ github.event.inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ github.event.inputs.pppoe_account }}" || -z "${{ github.event.inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: ⬇️ 下载官方 imagebuilder 包
        run: |
          luci_version="${{ github.event.inputs.luci_version }}"
          mkdir -p ${{ github.workspace }}/imagebuilder
          cd ${{ github.workspace }}/imagebuilder
          echo "下载 ${luci_version} imagebuilder 包..."
          wget -q "https://downloads.immortalwrt.org/releases/${luci_version}/targets/armsr/armv8/immortalwrt-imagebuilder-${luci_version}-armsr-armv8.Linux-x86_64.tar.zst"
          tar --zstd -xf immortalwrt-imagebuilder-${luci_version}-armsr-armv8.Linux-x86_64.tar.zst
          # 用 dotglob 移动所有文件（含隐藏文件 .config，否则 KERNEL_PATCHVER 为空报错）
          shopt -s dotglob
          mv immortalwrt-imagebuilder-${luci_version}-armsr-armv8.Linux-x86_64/* .
          shopt -u dotglob
          # 挂载配置和脚本（保留包自带 .config，避免 profile 检查失败）
          cp ${{ github.workspace }}/armsr-armv8/build25.sh build.sh
          cp -r ${{ github.workspace }}/shell shell
          cp -r ${{ github.workspace }}/files files
          mkdir -p files/etc/opkg
          cp ${{ github.workspace }}/arch/arch.conf files/etc/opkg/arch.conf
          echo "✅ imagebuilder 包就绪"

      - name: ✅ 正在构建ImmortalWrt固件25.12.x (armsr-armv8)
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G) ROOTFS_PARTSIZE=1024 ;;
            2G) ROOTFS_PARTSIZE=2048 ;;
            3G) ROOTFS_PARTSIZE=3072 ;;
            4G) ROOTFS_PARTSIZE=4096 ;;
          esac
          echo "ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE" >> $GITHUB_ENV
          include_docker="${{ github.event.inputs.include_docker }}"
          echo "Building for rootfs_partsize: $profile"
          cd ${{ github.workspace }}/imagebuilder
          # 准备 opkg-key 和 apk 配置
          mkdir -p scripts
          touch scripts/opkg-key
          chmod +x scripts/opkg-key
          echo 'CONFIG_USE_APK=y' >> .config
          sed -i '/block-readers\\|small-readers/d' include/image.mk
          sed -i 's/--no-scripts/--no-scripts --allow-untrusted/' include/image.mk
          # 创建 /home/build/immortalwrt 软链接（build.sh 硬编码此路径）
          sudo mkdir -p /home/build
          sudo ln -sfn ${{ github.workspace }}/imagebuilder /home/build/immortalwrt
          # 执行构建
          PROFILE="generic" ROOTFS_PARTSIZE=$ROOTFS_PARTSIZE INCLUDE_DOCKER=$include_docker \
            ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            bash build.sh

      - name: ✅ 复制固件到根目录
        run: |
          cp ${{ github.workspace }}/imagebuilder/bin/targets/armsr/armv8/*.qcow2 ${{ github.workspace }}/
          cp ${{ github.workspace }}/imagebuilder/bin/targets/armsr/armv8/*.vmdk ${{ github.workspace }}/

      - name: 🚀 上传固件到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: QEMU
          name: ImmortWrt-QEMU-armsr-armv8-25.12.x
          body_path: ${{ github.workspace }}/armsr-armv8/info.md
          files: |
            ${{ github.workspace }}/*.qcow2
            ${{ github.workspace }}/*.vmdk
          token: ${{ secrets.GITHUB_TOKEN }}
